name: aca-ai

x-defaults: &defaults
  restart: unless-stopped
  env_file: .env
  networks: [ai]

services:
  hello:
    <<: *defaults
    image: nginx:alpine
    ports:
      - "127.0.0.1:8081:80"     # localhost only, never exposed to the LAN
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ai:
    name: ai
