name: aca-ai

x-defaults: &defaults
  restart: unless-stopped
  env_file: .env
  networks: [ai]

services:
  llama-swap:
    <<: *defaults
    image: ghcr.io/mostlygeek/llama-swap:v277-cuda-b12808
    volumes:
      - /srv/models:/models:ro
      - ./services/llama-swap/config.yaml:/app/config.yaml:ro
    command: ["-config", "/app/config.yaml", "-listen", "0.0.0.0:8080"]
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

networks:
  ai:
    name: ai
